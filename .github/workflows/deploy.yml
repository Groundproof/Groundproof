name: Deploy GroundProof test
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Static JavaScript checks
        run: |
          node --check app.js
          node --check ledger.js
          node tests/core.mjs
      - name: Install browser QA
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run local app
        run: |
          python3 -m http.server 8765 >/tmp/groundproof-http.log 2>&1 &
          sleep 2
      - name: Browser workflow QA
        env:
          GP_TEST_URL: http://127.0.0.1:8765/
        run: node tests/workflows.cjs
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload static app
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
